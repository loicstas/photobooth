<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Pixel Photobooth - Bekijk je fotosessies en download fotostrips direct naar je apparaat.">
  <title>Pixel photobooth • Arcade Gallery</title>

  <!-- Google Web Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-brand">
        <div class="brand-cam" id="brand-cam" aria-hidden="true"></div>
        <div class="title-group">
          <h1>Pixel photobooth</h1>
          <p>Drie foto's, een strip. Kies een sessie en download je favoriet.</p>
        </div>
      </div>
    </header>

    <!-- Interactive Action Bar (Search & Filter) -->
    <nav class="action-bar" aria-label="Filters en acties">
      <div class="search-filter-group">
        <div class="search-box">
          <input 
            type="search" 
            id="search-input" 
            class="search-input" 
            placeholder="🔍 Zoek sessie of datum..." 
            aria-label="Zoek naar sessie of datum"
          >
        </div>
      </div>

      <div class="bar-stats">
        <span class="count-display" id="count">Laden...</span>
        <button class="btn yellow small" id="refresh-btn" type="button">
          <svg class="pixel-icon" viewBox="0 0 10 8" width="13" height="10" shape-rendering="crispEdges" aria-hidden="true" fill="currentColor">
            <rect x="2" y="0" width="4" height="1"/>
            <rect x="1" y="1" width="1" height="1"/><rect x="6" y="1" width="1" height="1"/>
            <rect x="0" y="2" width="1" height="1"/><rect x="7" y="2" width="1" height="1"/>
            <rect x="0" y="3" width="1" height="1"/><rect x="5" y="3" width="5" height="1"/>
            <rect x="0" y="4" width="1" height="1"/><rect x="6" y="4" width="3" height="1"/>
            <rect x="0" y="5" width="1" height="1"/><rect x="7" y="5" width="1" height="1"/>
            <rect x="1" y="6" width="1" height="1"/>
            <rect x="2" y="7" width="5" height="1"/>
          </svg>
          <span>Vernieuwen</span>
        </button>
      </div>
    </nav>

    <!-- Photos Grid -->
    <main id="grid" class="grid" aria-live="polite">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </main>
  </div>

  <!-- Lightbox Gallery Dialog -->
  <dialog id="lightbox" aria-labelledby="lightbox-title">
    <div class="modal-header">
      <span id="lightbox-title">Foto preview</span>
      <span class="dots"><i></i><i></i><i></i></span>
    </div>
    <div class="modal-body">
      <div class="modal-viewer">
        <img id="lightbox-img" src="" alt="Geselecteerde foto">
      </div>

      <!-- Filmstrip thumbnails of this session -->
      <div class="modal-filmstrip" id="lightbox-filmstrip" aria-label="Sessie miniaturen"></div>

      <!-- Lightbox Controls -->
      <div class="modal-actions">
        <div class="modal-nav">
          <button class="btn" id="prev-btn" type="button" aria-label="Vorige foto">&lt; Vorige</button>
          <button class="btn" id="next-btn" type="button" aria-label="Volgende foto">Volgende &gt;</button>
        </div>
        
        <div class="modal-buttons-right">
          <button class="btn cyan" id="rotate-btn" type="button" title="Draai foto 90 graden">
            <svg class="pixel-icon" viewBox="0 0 10 8" width="13" height="10" shape-rendering="crispEdges" aria-hidden="true" fill="currentColor">
              <rect x="2" y="0" width="4" height="1"/>
              <rect x="1" y="1" width="1" height="1"/><rect x="6" y="1" width="1" height="1"/>
              <rect x="0" y="2" width="1" height="1"/><rect x="7" y="2" width="1" height="1"/>
              <rect x="0" y="3" width="1" height="1"/><rect x="5" y="3" width="5" height="1"/>
              <rect x="0" y="4" width="1" height="1"/><rect x="6" y="4" width="3" height="1"/>
              <rect x="0" y="5" width="1" height="1"/><rect x="7" y="5" width="1" height="1"/>
              <rect x="1" y="6" width="1" height="1"/>
              <rect x="2" y="7" width="5" height="1"/>
            </svg>
            <span>Draaien</span>
          </button>
          <button class="btn yellow" id="copy-link-btn" type="button">🔗 Link Kopiëren</button>
          <a class="btn pink" id="download-btn" download>💾 Download</a>
          <button class="btn" id="close-btn" type="button">Sluiten</button>
        </div>
      </div>
    </div>
  </dialog>

  <!-- Floating Toast Notifications -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- Application Script -->
  <script src="app.js"></script>
</body>
</html>
